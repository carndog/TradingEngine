name: Deploy development infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infrastructure-development.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infrastructure-development.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Lint Bicep
        run: az bicep lint --file infra/main.bicep

  whatif:
    name: What-if development infrastructure
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: development-infrastructure-preview
    permissions:
      id-token: write
      contents: read
    env:
      DEPLOYMENT_NAME: tradingengine-dev-whatif-${{ github.run_id }}
      AZURE_SQL_ENTRA_ADMIN_LOGIN: ${{ secrets.AZURE_SQL_ENTRA_ADMIN_LOGIN }}
      AZURE_SQL_ENTRA_ADMIN_OBJECT_ID: ${{ secrets.AZURE_SQL_ENTRA_ADMIN_OBJECT_ID }}
      AZURE_SQL_ENTRA_ADMIN_PRINCIPAL_TYPE: ${{ secrets.AZURE_SQL_ENTRA_ADMIN_PRINCIPAL_TYPE }}
      AZURE_DATABASE_PROBE_KEY: ${{ secrets.AZURE_DATABASE_PROBE_KEY }}
      AZURE_ENTRA_AUTH_CLIENT_ID: ${{ secrets.AZURE_ENTRA_AUTH_CLIENT_ID }}
      AZURE_ENTRA_AUTH_ALLOWED_PRINCIPALS: ${{ secrets.AZURE_ENTRA_AUTH_ALLOWED_PRINCIPALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check deployment secrets
        run: |
          missing=0
          for name in AZURE_SQL_ENTRA_ADMIN_LOGIN AZURE_SQL_ENTRA_ADMIN_OBJECT_ID AZURE_SQL_ENTRA_ADMIN_PRINCIPAL_TYPE AZURE_DATABASE_PROBE_KEY AZURE_ENTRA_AUTH_CLIENT_ID AZURE_ENTRA_AUTH_ALLOWED_PRINCIPALS; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is not set on the development-infrastructure-preview environment."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Set the AZURE_SQL_ENTRA_ADMIN_*, AZURE_DATABASE_PROBE_KEY and AZURE_ENTRA_AUTH_* secrets on the development-infrastructure-preview environment. Values are never printed."
            exit 1
          fi

      - name: Run subscription what-if (merge preview, SQL enabled)
        run: |
          az deployment sub what-if \
            --name "$DEPLOYMENT_NAME" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --location "${{ vars.AZURE_DEPLOYMENT_LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters infra/environments/dev.bicepparam \
            --parameters sqlEntraAdminLogin="$AZURE_SQL_ENTRA_ADMIN_LOGIN" \
            --parameters sqlEntraAdminObjectId="$AZURE_SQL_ENTRA_ADMIN_OBJECT_ID" \
            --parameters sqlEntraAdminPrincipalType="$AZURE_SQL_ENTRA_ADMIN_PRINCIPAL_TYPE" \
            --parameters databaseProbeKey="$AZURE_DATABASE_PROBE_KEY" \
            --parameters entraAuthClientId="$AZURE_ENTRA_AUTH_CLIENT_ID" \
            --parameters entraAuthAllowedPrincipalIds="$AZURE_ENTRA_AUTH_ALLOWED_PRINCIPALS" \
            --no-pretty-print \
            --output json > what-if.json

      - name: Write what-if summary
        run: |
          {
            echo "## Merge preview — Azure SQL and Easy Auth enabled"
            echo ""
            echo "This is the change set that merging this pull request applies to the development environment. \`provisionAzureSql\` is \`true\` in \`dev.bicepparam\`, so merging provisions the Azure SQL logical server and free-offer database and sets the \`ConnectionStrings__TradingEngine\` app setting on the Web App. \`configureEntraAuth\` is also \`true\`, so merging enables App Service Easy Auth with Microsoft Entra ID, creates the dedicated user-assigned Easy Auth identity and restricts access to the owner principal allowlist. The Entra administrator, app registration and allowlist values come from the \`development-infrastructure-preview\` environment secrets and are never printed."
            echo ""
            echo "**Cost gate:** merging triggers the real deployment, which provisions Azure SQL. Issue #35 requires Jason's explicit cost approval immediately before that deployment; review this what-if and the free-offer settings in \`infra/modules/sql-database.bicep\` first."
            echo ""
            echo "### What-if: \`$DEPLOYMENT_NAME\`"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            change_count=$(jq '(.changes // []) | length' what-if.json)
            if [ "$change_count" = "0" ]; then
              echo "No changes detected. The deployed resources already match the template."
            else
              echo "| Change | Resource type | Resource ID |"
              echo "| --- | --- | --- |"
              jq -r '(.changes // [])[] | "| \(.changeType) | \(.after.type // .before.type // "Unknown") | \(.resourceId) |"' what-if.json
              echo ""
              echo "#### Property changes"
              echo ""
              jq -r '
                def delta_rows:
                  . as $d
                  | ($d.children // []) as $children
                  | if ($children | length) > 0 then
                      $children[] | delta_rows
                    else
                      "| `\($d.path // "?")` | \($d.propertyChangeType // $d.changeType // "Unknown") |"
                    end;
                (.changes // [])[] |
                  "##### `\(.resourceId)`",
                  "",
                  "| Property path | Change |",
                  "| --- | --- |",
                  ((.delta // []) | if length == 0 then
                    "| — | No property-level delta reported |"
                  else
                    (.[] | delta_rows)
                  end),
                  ""
              ' what-if.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy development infrastructure
    needs: validate
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-infrastructure-development
      cancel-in-progress: false
    env:
      DEPLOYMENT_NAME: tradingengine-dev-${{ github.run_id }}
      AZURE_SQL_ENTRA_ADMIN_LOGIN: ${{ secrets.AZURE_SQL_ENTRA_ADMIN_LOGIN }}
      AZURE_SQL_ENTRA_ADMIN_OBJECT_ID: ${{ secrets.AZURE_SQL_ENTRA_ADMIN_OBJECT_ID }}
      AZURE_SQL_ENTRA_ADMIN_PRINCIPAL_TYPE: ${{ secrets.AZURE_SQL_ENTRA_ADMIN_PRINCIPAL_TYPE }}
      AZURE_DATABASE_PROBE_KEY: ${{ secrets.AZURE_DATABASE_PROBE_KEY }}
      AZURE_ENTRA_AUTH_CLIENT_ID: ${{ secrets.AZURE_ENTRA_AUTH_CLIENT_ID }}
      AZURE_ENTRA_AUTH_ALLOWED_PRINCIPALS: ${{ secrets.AZURE_ENTRA_AUTH_ALLOWED_PRINCIPALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check deployment secrets
        run: |
          missing=0
          for name in AZURE_SQL_ENTRA_ADMIN_LOGIN AZURE_SQL_ENTRA_ADMIN_OBJECT_ID AZURE_SQL_ENTRA_ADMIN_PRINCIPAL_TYPE AZURE_DATABASE_PROBE_KEY AZURE_ENTRA_AUTH_CLIENT_ID AZURE_ENTRA_AUTH_ALLOWED_PRINCIPALS; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is not set on the development environment."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Set the AZURE_SQL_ENTRA_ADMIN_*, AZURE_DATABASE_PROBE_KEY and AZURE_ENTRA_AUTH_* secrets on the development environment. Values are never printed."
            exit 1
          fi

      - name: Deploy subscription-scope Bicep
        run: |
          az deployment sub create \
            --name "$DEPLOYMENT_NAME" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --location "${{ vars.AZURE_DEPLOYMENT_LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters infra/environments/dev.bicepparam \
            --parameters sqlEntraAdminLogin="$AZURE_SQL_ENTRA_ADMIN_LOGIN" \
            --parameters sqlEntraAdminObjectId="$AZURE_SQL_ENTRA_ADMIN_OBJECT_ID" \
            --parameters sqlEntraAdminPrincipalType="$AZURE_SQL_ENTRA_ADMIN_PRINCIPAL_TYPE" \
            --parameters databaseProbeKey="$AZURE_DATABASE_PROBE_KEY" \
            --parameters entraAuthClientId="$AZURE_ENTRA_AUTH_CLIENT_ID" \
            --parameters entraAuthAllowedPrincipalIds="$AZURE_ENTRA_AUTH_ALLOWED_PRINCIPALS"

      - name: Write deployment summary
        run: |
          az deployment sub show \
            --name "$DEPLOYMENT_NAME" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query properties.outputs -o json > outputs.json
          {
            echo "### Infrastructure deployment: \`$DEPLOYMENT_NAME\`"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Deployment name | \`$DEPLOYMENT_NAME\` |"
            jq -r 'to_entries[] | "| \(.key) | `\(.value.value)` |"' outputs.json
          } >> "$GITHUB_STEP_SUMMARY"
