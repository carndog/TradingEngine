name: Deploy development infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infrastructure-development.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infrastructure-development.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Lint Bicep
        run: az bicep lint --file infra/main.bicep

  whatif:
    name: What-if development infrastructure
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: development-infrastructure-preview
    permissions:
      id-token: write
      contents: read
    env:
      DEPLOYMENT_NAME: tradingengine-dev-whatif-${{ github.run_id }}
      SQL_PREVIEW_DEPLOYMENT_NAME: tradingengine-dev-whatif-sql-${{ github.run_id }}
      AZURE_SQL_ENTRA_ADMIN_LOGIN: ${{ secrets.AZURE_SQL_ENTRA_ADMIN_LOGIN }}
      AZURE_SQL_ENTRA_ADMIN_OBJECT_ID: ${{ secrets.AZURE_SQL_ENTRA_ADMIN_OBJECT_ID }}
      AZURE_SQL_ENTRA_ADMIN_PRINCIPAL_TYPE: ${{ secrets.AZURE_SQL_ENTRA_ADMIN_PRINCIPAL_TYPE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run subscription what-if (safe merge, SQL disabled)
        run: |
          az deployment sub what-if \
            --name "$DEPLOYMENT_NAME" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --location "${{ vars.AZURE_DEPLOYMENT_LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters infra/environments/dev.bicepparam \
            --no-pretty-print \
            --output json > what-if.json

      - name: Check SQL preview secrets
        run: |
          missing=0
          for name in AZURE_SQL_ENTRA_ADMIN_LOGIN AZURE_SQL_ENTRA_ADMIN_OBJECT_ID AZURE_SQL_ENTRA_ADMIN_PRINCIPAL_TYPE; do
            if [ -z "${!name}" ]; then
              echo "::error::Required preview secret $name is not set on the development-infrastructure-preview environment."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Set the AZURE_SQL_ENTRA_ADMIN_* secrets on the development-infrastructure-preview environment. Values are never printed."
            exit 1
          fi

      - name: Run subscription what-if (planned SQL deployment, SQL enabled)
        run: |
          az deployment sub what-if \
            --name "$SQL_PREVIEW_DEPLOYMENT_NAME" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --location "${{ vars.AZURE_DEPLOYMENT_LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters infra/environments/dev.bicepparam \
            --parameters provisionAzureSql=true \
            --parameters sqlEntraAdminLogin="$AZURE_SQL_ENTRA_ADMIN_LOGIN" \
            --parameters sqlEntraAdminObjectId="$AZURE_SQL_ENTRA_ADMIN_OBJECT_ID" \
            --parameters sqlEntraAdminPrincipalType="$AZURE_SQL_ENTRA_ADMIN_PRINCIPAL_TYPE" \
            --no-pretty-print \
            --output json > what-if-sql.json

      - name: Write what-if summary
        run: |
          {
            echo "## Safe merge preview — Azure SQL disabled"
            echo ""
            echo "This is the change set that merging this pull request applies to the development environment. \`provisionAzureSql\` is \`false\`, so no Azure SQL resources are created."
            echo ""
            echo "### What-if: \`$DEPLOYMENT_NAME\`"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            change_count=$(jq '(.changes // []) | length' what-if.json)
            if [ "$change_count" = "0" ]; then
              echo "No changes detected. The deployed resources already match the template."
            else
              echo "| Change | Resource type | Resource ID |"
              echo "| --- | --- | --- |"
              jq -r '(.changes // [])[] | "| \(.changeType) | \(.after.type // .before.type // "Unknown") | \(.resourceId) |"' what-if.json
              echo ""
              echo "#### Property changes"
              echo ""
              jq -r '
                def delta_rows:
                  . as $d
                  | ($d.children // []) as $children
                  | if ($children | length) > 0 then
                      $children[] | delta_rows
                    else
                      "| `\($d.path // "?")` | \($d.propertyChangeType // $d.changeType // "Unknown") |"
                    end;
                (.changes // [])[] |
                  "##### `\(.resourceId)`",
                  "",
                  "| Property path | Change |",
                  "| --- | --- |",
                  ((.delta // []) | if length == 0 then
                    "| — | No property-level delta reported |"
                  else
                    (.[] | delta_rows)
                  end),
                  ""
              ' what-if.json
            fi
            echo ""
            echo "## Planned SQL deployment preview — Azure SQL enabled"
            echo ""
            echo "This preview forces \`provisionAzureSql=true\` with the Entra administrator values from the \`development-infrastructure-preview\` environment secrets. It shows what a later issue-35 change would create; it is never deployed by this workflow."
            echo ""
            echo "### What-if: \`$SQL_PREVIEW_DEPLOYMENT_NAME\`"
            echo ""
            sql_change_count=$(jq '(.changes // []) | length' what-if-sql.json)
            if [ "$sql_change_count" = "0" ]; then
              echo "No changes detected. The deployed resources already match the template."
            else
              echo "| Change | Resource type | Resource ID |"
              echo "| --- | --- | --- |"
              jq -r '(.changes // [])[] | "| \(.changeType) | \(.after.type // .before.type // "Unknown") | \(.resourceId) |"' what-if-sql.json
              echo ""
              echo "#### Property changes"
              echo ""
              jq -r '
                def delta_rows:
                  . as $d
                  | ($d.children // []) as $children
                  | if ($children | length) > 0 then
                      $children[] | delta_rows
                    else
                      "| `\($d.path // "?")` | \($d.propertyChangeType // $d.changeType // "Unknown") |"
                    end;
                (.changes // [])[] |
                  "##### `\(.resourceId)`",
                  "",
                  "| Property path | Change |",
                  "| --- | --- |",
                  ((.delta // []) | if length == 0 then
                    "| — | No property-level delta reported |"
                  else
                    (.[] | delta_rows)
                  end),
                  ""
              ' what-if-sql.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy development infrastructure
    needs: validate
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-infrastructure-development
      cancel-in-progress: false
    env:
      DEPLOYMENT_NAME: tradingengine-dev-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy subscription-scope Bicep
        run: |
          az deployment sub create \
            --name "$DEPLOYMENT_NAME" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --location "${{ vars.AZURE_DEPLOYMENT_LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters infra/environments/dev.bicepparam \
            --parameters provisionAzureSql=false

      - name: Write deployment summary
        run: |
          az deployment sub show \
            --name "$DEPLOYMENT_NAME" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query properties.outputs -o json > outputs.json
          {
            echo "### Infrastructure deployment: \`$DEPLOYMENT_NAME\`"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Deployment name | \`$DEPLOYMENT_NAME\` |"
            jq -r 'to_entries[] | "| \(.key) | `\(.value.value)` |"' outputs.json
          } >> "$GITHUB_STEP_SUMMARY"
