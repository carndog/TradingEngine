name: Migrate development database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Apply EF Core migrations
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development-database-migration
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: migrate-development-database
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: rg-tradingengine-dev
      SQL_DATABASE_NAME: sqldb-tradingengine-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Azure login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_MIGRATION_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve SQL server and verify database
        run: |
          server_count=$(az sql server list --resource-group "$RESOURCE_GROUP" --query "length(@)" -o tsv)
          if [ "$server_count" != "1" ]; then
            echo "::error::Expected exactly one SQL server in $RESOURCE_GROUP, found $server_count."
            exit 1
          fi
          SQL_SERVER_NAME=$(az sql server list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          SQL_SERVER_FQDN=$(az sql server list --resource-group "$RESOURCE_GROUP" --query "[0].fullyQualifiedDomainName" -o tsv)
          resolved_db=$(az sql db show --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER_NAME" --name "$SQL_DATABASE_NAME" --query name -o tsv)
          if [ "$resolved_db" != "$SQL_DATABASE_NAME" ]; then
            echo "::error::Expected database $SQL_DATABASE_NAME on $SQL_SERVER_NAME was not found."
            exit 1
          fi
          echo "SQL_SERVER_NAME=$SQL_SERVER_NAME" >> "$GITHUB_ENV"
          echo "SQL_SERVER_FQDN=$SQL_SERVER_FQDN" >> "$GITHUB_ENV"

      - name: Add temporary firewall rule for runner
        run: |
          runner_ip=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name "github-actions-migration-${{ github.run_id }}" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip" \
            --output none

      - name: Build EF Core migration bundle
        run: |
          dotnet ef migrations bundle \
            --project src/TradingEngine.Infrastructure \
            --startup-project src/TradingEngine.Infrastructure \
            --configuration Release \
            --output efbundle
          chmod +x efbundle

      - name: Apply migrations
        run: |
          ./efbundle --connection "Server=tcp:${SQL_SERVER_FQDN},1433;Database=${SQL_DATABASE_NAME};Authentication=Active Directory Default;Encrypt=True;"

      - name: Remove temporary firewall rule
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name "github-actions-migration-${{ github.run_id }}" \
            --output none || true
